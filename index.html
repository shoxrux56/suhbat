<!doctype html>
<html lang="uz" translate="no"><head><meta charset="utf-8"><meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Suhbat</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#1f2a37;--mu:#6b7785;--gr:#58cc02;--grd:#46a302;--bl:#1cb0f6}
@media(prefers-color-scheme:dark){:root{--bg:#131f24;--card:#1e2d34;--tx:#eef3f5;--mu:#93a4ad}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:420px;background:var(--card);border-radius:28px;padding:34px 22px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.08)}
#em{font-size:84px;line-height:1;margin-bottom:6px}
#em.live{animation:p 1.4s ease-in-out infinite}
@keyframes p{50%{transform:scale(1.12)}}
h1{font-size:26px;margin:8px 0 6px}
#sub{color:var(--mu);margin:0 0 22px;min-height:24px}
button{font:inherit;font-weight:800;border:0;border-radius:16px;padding:15px 22px;cursor:pointer;width:100%}
#go{background:var(--gr);color:#fff;box-shadow:0 4px 0 var(--grd);font-size:19px}
#go:active{transform:translateY(3px);box-shadow:none}
.row{display:flex;gap:10px}.row button{background:var(--bg);color:var(--tx);box-shadow:0 3px 0 rgba(0,0,0,.12)}
#next{background:var(--bl)!important;color:#fff!important}
[hidden]{display:none!important}
</style></head><body>
<div class="box">
  <div id="em">🎙</div>
  <h1 id="st">Gaplashish</h1>
  <p id="sub">Tugmani bosing: suhbatdosh o'zi topiladi</p>
  <button id="go">Boshlash</button>
  <div class="row" id="ctl" hidden><button id="mute">🎤 Yoqiq</button><button id="next">⏭ Keyingi</button></div>
</div>
<audio id="au" autoplay playsinline></audio>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var ws,pc,stream,ice=[],pend=[],active=false,tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand()}catch(e){}}
function ui(em,st,sub,live){$("em").textContent=em;$("em").className=live?"live":"";$("st").textContent=st;$("sub").textContent=sub||""}
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function closePc(){if(pc){try{pc.ontrack=pc.onicecandidate=pc.onconnectionstatechange=null;pc.close()}catch(e){}pc=null}pend=[];$("au").srcObject=null}
function waitUi(n){ui("⏳","Suhbatdosh kutilyapti",n>1?"Hozir saytda "+n+" kishi bor, tez ulanadi":"Hozircha siz yolg'izsiz. Boshqa kirganda darhol ulanasiz")}
function flush(my){pend.splice(0).forEach(function(c){my.addIceCandidate(c).catch(function(){})})}
function startPc(init){
  closePc();var my=pc=new RTCPeerConnection({iceServers:ice});
  stream.getTracks().forEach(function(t){my.addTrack(t,stream)});
  my.ontrack=function(e){var a=$("au");a.srcObject=e.streams[0];var p=a.play();if(p&&p.catch)p.catch(function(){})};
  my.onicecandidate=function(e){if(e.candidate&&pc===my)send({t:"ice",d:e.candidate})};
  my.onconnectionstatechange=function(){
    if(pc!==my)return;var s=my.connectionState;
    if(s==="connected")ui("🗣","Gaplashing!","Suhbatdosh bilan ulandingiz",true);
    else if(s==="failed"){ui("⚠️","Ulanib bo'lmadi","Boshqa suhbatdosh qidirilmoqda…");next()}
    else if(s==="disconnected")setTimeout(function(){if(pc===my&&my.connectionState==="disconnected"){next()}},5000);
  };
  ui("🔗","Ulanmoqda…","Bir soniya");
  if(init)my.createOffer().then(function(o){return my.setLocalDescription(o)}).then(function(){send({t:"offer",d:my.localDescription})});
}
function onMsg(m){
  if(m.t==="hello"){ice=m.ice||[];if(active)send({t:"join"})}
  else if(m.t==="wait"){if(!pc)waitUi(m.n)}
  else if(m.t==="match")startPc(m.init);
  else if(m.t==="left"){closePc();ui("👋","Suhbatdosh chiqib ketdi","Yangisi qidirilmoqda…");send({t:"join"})}
  else if(m.t==="offer"&&pc){var my=pc;my.setRemoteDescription(m.d).then(function(){flush(my);return my.createAnswer()}).then(function(a){return my.setLocalDescription(a)}).then(function(){send({t:"answer",d:my.localDescription})})}
  else if(m.t==="answer"&&pc){var q=pc;q.setRemoteDescription(m.d).then(function(){flush(q)})}
  else if(m.t==="ice"&&pc){if(pc.remoteDescription)pc.addIceCandidate(m.d).catch(function(){});else pend.push(m.d)}
}
function open(){
  ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws");
  ws.onmessage=function(e){try{onMsg(JSON.parse(e.data))}catch(x){}};
  ws.onclose=function(){if(active){closePc();ui("📡","Aloqa uzildi","Qayta ulanmoqda…");setTimeout(open,1500)}};
}
function next(){closePc();ui("⏳","Qidirilmoqda…","");send({t:"join"})}
$("go").onclick=function(){
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){ui("⚠️","Mikrofon yo'q","Brauzerni yangilang yoki Chrome/Safari'da oching");return}
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}).then(function(s){
    stream=s;active=true;$("go").hidden=true;$("ctl").hidden=false;$("au").play().catch(function(){});ui("⏳","Ulanmoqda…","");open();
  }).catch(function(){ui("🎤","Mikrofonga ruxsat bering","Brauzer sozlamasidan mikrofonni yoqing, so'ng qayta urining")});
};
$("next").onclick=next;
$("mute").onclick=function(){var on=!(stream.getAudioTracks()[0].enabled);stream.getAudioTracks().forEach(function(t){t.enabled=on});$("mute").textContent=on?"🎤 Yoqiq":"🔇 O'chiq"};
})();
</script></body></html>
